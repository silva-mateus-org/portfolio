name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ── Customizar por app ────────────────────────────────────────────────────────
# Para replicar este template em outro projeto, ajuste as variáveis abaixo.
# Veja .github/workflows/SETUP.md para instruções detalhadas.
env:
  BACKEND_DIR: ApiServer
  BACKEND_TESTS_DIR: ApiServer.Tests
  DOTNET_VERSION: '9.0.x'
  API_IMAGE: ghcr.io/silva-mateus-org/portfolio-api
  WEB_IMAGE: ghcr.io/silva-mateus-org/portfolio
  DOTNET_INSTALL_DIR: /home/deploy/.dotnet
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write  # necessário para push no GHCR

jobs:
  # ── Backend: restore → build → xUnit ─────────────────────────────────────
  # Sem frontend Node.js — apenas o job de backend corre em paralelo com build.
  test-backend:
    name: Backend Tests
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore backend
        run: dotnet restore
        working-directory: ${{ env.BACKEND_DIR }}

      - name: Restore tests
        run: dotnet restore
        working-directory: ${{ env.BACKEND_TESTS_DIR }}

      - name: Build backend
        run: dotnet build --no-restore --configuration Release
        working-directory: ${{ env.BACKEND_DIR }}

      - name: Build tests
        run: dotnet build --no-restore --configuration Release
        working-directory: ${{ env.BACKEND_TESTS_DIR }}

      - name: Run xUnit tests
        run: |
          dotnet test --no-build --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage"
        working-directory: ${{ env.BACKEND_TESTS_DIR }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: ${{ env.BACKEND_TESTS_DIR }}/TestResults

  # ── Build + Push para GHCR (apenas push para main) ───────────────────────
  # Watchtower detecta a nova imagem :latest e reinicia os containers.
  build-and-push:
    name: Build and Push Images
    runs-on: [self-hosted, linux]
    needs: [test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ env.API_IMAGE }}:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:latest
